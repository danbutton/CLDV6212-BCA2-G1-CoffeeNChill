# CoffeeNChill - Part 2 orchestration
# Starts Azurite and the Functions host together with one command: docker compose up -d
# Both images are pulled from Docker Hub (no local build paths), as the brief requires.

name: coffeenchill

# Shared Azurite connection string. The host is "azurite" (the service name below),
# not 127.0.0.1 - inside a container, localhost means that container itself.
x-storage-connection: &storage "DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;QueueEndpoint=http://azurite:10001/devstoreaccount1;TableEndpoint=http://azurite:10002/devstoreaccount1;"

services:

  azurite:
    image: danbutton/coffeenchill-azurite:v2.0
    # Bind all three services to 0.0.0.0 so the Functions container can reach them
    command: >
      azurite
      --blobHost 0.0.0.0
      --queueHost 0.0.0.0
      --tableHost 0.0.0.0
      --location /data
      --skipApiVersionCheck
      --loose
    ports:
      - "10000:10000"   # Blob
      - "10001:10001"   # Queue
      - "10002:10002"   # Table
    volumes:
      - azurite-data:/data   # menu items, documents and orders survive restarts
    networks:
      - coffeenchill-net
    restart: unless-stopped

  functions:
    image: danbutton/coffeenchill-functions:v2.0
    platform: linux/amd64   # Functions base images are amd64-only
    depends_on:
      - azurite
    ports:
      - "7071:80"
    environment:
      AzureWebJobsStorage: *storage
      TableStorageConnection: *storage
      BlobStorageConnection: *storage
      QueueStorageConnection: *storage
      MenuTableName: "MenuItems"
      StaffDocsContainerName: "staff-docs"
      OrdersTableName: "Orders"
      OrderQueueName: "order-processing-queue"
      OrderStageDelaySeconds: "5"
    networks:
      - coffeenchill-net
    restart: unless-stopped

networks:
  coffeenchill-net:
    driver: bridge

volumes:
  azurite-data:
